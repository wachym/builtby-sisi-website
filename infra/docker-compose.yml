# Local infrastructure for Sisi OS.
#
# The backend runs on the host (fast reloads); its dependencies run here, so
# every developer and every CI run uses the same engines as production.
#
#   docker compose -f infra/docker-compose.yml up -d
#   DATABASE_URL=postgres://sisi:sisi@localhost:5432/sisi python manage.py migrate
#
# pgvector is included from the start: agent memory in Phase 2 needs it, and
# swapping the image later means recreating the volume.

name: sisi-os

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sisi
      POSTGRES_PASSWORD: sisi
      POSTGRES_DB: sisi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisi -d sisi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Broker and result backend for the Celery workers that arrive in Phase 2.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
